name: Update and Deploy Core Directory

on:
  schedule:
    - cron: '14,44 * * * *'
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: core-directory-update
  cancel-in-progress: false

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read
    outputs:
      stale: ${{ steps.commit-cache.outputs.stale }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Sync GitHub releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/sync.py

      - name: Commit updated cache
        id: commit-cache
        run: |
          BASE_SHA="$(git rev-parse HEAD)"
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$BASE_SHA" ]; then
            echo "origin/main advanced during sync; dropping this run."
            echo "stale=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/cache.json
          if ! git diff --cached --quiet; then
            git commit -m "automated: update release cache"
            if ! git push; then
              git fetch origin main
              if [ "$(git rev-parse origin/main)" != "$BASE_SHA" ]; then
                echo "origin/main advanced before push; dropping this run."
                echo "stale=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              exit 1
            fi
          else
            echo "No release cache changes."
          fi

      - name: Build static site
        if: steps.commit-cache.outputs.stale != 'true'
        run: python3 scripts/build.py

      - uses: actions/configure-pages@v5
        if: steps.commit-cache.outputs.stale != 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.commit-cache.outputs.stale != 'true'
        with:
          path: site

  deploy:
    needs: sync-and-build
    if: needs.sync-and-build.outputs.stale != 'true'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
